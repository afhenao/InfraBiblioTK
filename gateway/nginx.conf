# Gateway de BiblioTK: un solo origen para todo (apps y APIs). Así hay una sola cookie de sesión,
# no hace falta CORS y cada servicio conserva su prefijo de rutas de siempre.
# Los nombres (login, perfil, front-user…) son los servicios de Docker Compose y de Kubernetes:
# el mismo archivo sirve para los dos.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;

    # Portadas de hasta 3 MB más el resto del formulario
    client_max_body_size 5m;

    proxy_http_version 1.1;
    # Host original: Materiales arma con él la URL de las portadas locales
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Salud del propio gateway (Docker Compose y las sondas de Kubernetes), sin depender de nadie
    location = /gateway-salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /interno es solo entre servicios (los backends avisan eventos): desde afuera no existe
    location /NotificacionesBiblioTK/interno/ {
        return 404;
    }

    # WebSocket de las notificaciones (solo WebSocket: no hace falta afinidad entre réplicas)
    location /NotificacionesBiblioTK/socket.io/ {
        proxy_pass http://notificaciones:3006;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location /NotificacionesBiblioTK/ { proxy_pass http://notificaciones:3006; }
    location /RegistroBiblioTK/      { proxy_pass http://registro:3000; }
    location /BiblioTK/              { proxy_pass http://login:3001; }
    location /PerfilBiblioTK/        { proxy_pass http://perfil:3002; }
    location /MaterialesBiblioTK/    { proxy_pass http://materiales:3003; }
    location /DashboardBibliotk/     { proxy_pass http://dashboard:3004; }
    location /PrestamosBiblioTK/     { proxy_pass http://prestamos:3005; }

    # Apps: la barra final de proxy_pass quita la subruta y el nginx de cada app sirve su compilado
    location = /lector        { return 301 /lector/; }
    location /lector/         { proxy_pass http://front-user:8080/; }
    location = /bibliotecario { return 301 /bibliotecario/; }
    location /bibliotecario/  { proxy_pass http://front-admin:8080/; }
    location = /superadmin    { return 301 /superadmin/; }
    location /superadmin/     { proxy_pass http://front-superadmin:8080/; }
    location = /movil         { return 301 /movil/; }
    location /movil/          { proxy_pass http://movil:8080/; }

    # Todo lo demás es la landing (/, /login, /register, /catalogo)
    location / { proxy_pass http://front:8080; }
}
