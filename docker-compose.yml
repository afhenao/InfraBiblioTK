# BiblioTK completo con Docker Compose: http://localhost:8080
#   docker compose up -d --build        todo (MariaDB, Redis, 7 servicios, 5 apps y el gateway)
#   docker compose up -d redis          solo Redis, para desarrollo local con npm run dev
# Valores sensibles y la URL del celular: InfraBiblioTK/.env (ver .env.example). Los de abajo
# son solo para usar en el propio computador: la BD no se publica fuera de la red de Compose.
name: bibliotk

x-backend: &backend
  restart: unless-stopped
  depends_on:
    mariadb:
      condition: service_healthy

x-entorno: &entorno
  TZ: America/Bogota
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_USER: ${DB_USER:-bibliotk}
  DB_PASSWORD: ${DB_PASSWORD:-bibliotk-local}
  DB_NAME: bibliotk
  # Un solo origen: el del gateway (las apps abren el socket y llaman a las APIs desde ahí)
  ALLOWED_ORIGIN_1: http://localhost:8080
  NOTIFICACIONES_URL: http://notificaciones:3006/NotificacionesBiblioTK
  NOTIFICACIONES_CLAVE: ${NOTIFICACIONES_CLAVE:-clave-local-de-compose}

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      MARIADB_DATABASE: bibliotk
      MARIADB_USER: ${DB_USER:-bibliotk}
      MARIADB_PASSWORD: ${DB_PASSWORD:-bibliotk-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-bibliotk-root-local}
    volumes:
      - bd:/var/lib/mysql
      # Esquema y catálogo de ejemplo: solo la primera vez (volumen vacío)
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Canal de eventos e historial breve de NotificacionesBiblioTK (y adaptador de Socket.IO)
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  registro:
    <<: *backend
    build: ../RegistroBiblioTK
    image: bibliotk/registro:local
    environment:
      <<: *entorno
      PORT: "3000"

  login:
    <<: *backend
    build: ../InicioSesionBiblioTK
    image: bibliotk/login:local
    environment:
      <<: *entorno
      PORT: "3001"
      # A qué app va cada cuenta tras el login (subrutas del gateway)
      APP_USUARIO_URL: http://localhost:8080/lector/
      APP_ADMIN_URL: http://localhost:8080/bibliotecario/
      APP_SUPERADMIN_URL: http://localhost:8080/superadmin/

  perfil:
    <<: *backend
    build: ../PerfilBiblioTK
    image: bibliotk/perfil:local
    environment:
      <<: *entorno
      PORT: "3002"

  materiales:
    <<: *backend
    build: ../MaterialesBiblioTK
    image: bibliotk/materiales:local
    environment:
      <<: *entorno
      PORT: "3003"
    volumes:
      - portadas:/app/uploads

  dashboard:
    <<: *backend
    build: ../BackDashboardBiblioTK
    image: bibliotk/dashboard:local
    environment:
      <<: *entorno
      PORT: "3004"

  prestamos:
    <<: *backend
    build: ../PrestamosBiblioTK
    image: bibliotk/prestamos:local
    environment:
      <<: *entorno
      PORT: "3005"

  notificaciones:
    <<: *backend
    build: ../NotificacionesBiblioTK
    image: bibliotk/notificaciones:local
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *entorno
      PORT: "3006"
      REDIS_URL: redis://redis:6379
      # El contenedor no ve la IP del computador: para el celular, http://<IP en la red local>:8080/movil/
      MOVIL_URL: ${MOVIL_URL:-http://localhost:8080/movil/}

  front:
    build: ../BiblioTK-front
    image: bibliotk/front:local
    restart: unless-stopped

  front-user:
    build: ../BiblioTK-front-user
    image: bibliotk/front-user:local
    restart: unless-stopped

  front-admin:
    build: ../BiblioTK-front-admin
    image: bibliotk/front-admin:local
    restart: unless-stopped

  front-superadmin:
    build: ../BiblioTK-front-superadmin
    image: bibliotk/front-superadmin:local
    restart: unless-stopped

  movil:
    build: ../BiblioTK-notificaciones
    image: bibliotk/movil:local
    restart: unless-stopped

  # Único punto de entrada: reparte por prefijo de ruta (ver gateway/nginx.conf)
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - registro
      - login
      - perfil
      - materiales
      - dashboard
      - prestamos
      - notificaciones
      - front
      - front-user
      - front-admin
      - front-superadmin
      - movil

volumes:
  bd:
  portadas:
