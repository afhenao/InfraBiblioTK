# Backends Node/Express de BiblioTK (uno por microservicio)
# Mismo formato para cada servicio. Se aplica todo junto con: kubectl apply -k InfraBiblioTK
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registro
  labels:
    app: registro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registro
  template:
    metadata:
      labels:
        app: registro
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # No arranca hasta que la BD (y Redis, si hace falta) acepten conexiones
      initContainers:
        - name: esperar-dependencias
          image: bibliotk/registro:local
          imagePullPolicy: Always
          command: ["sh", "-c", "until nc -z mariadb 3306; do echo esperando a mariadb; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: registro
          image: bibliotk/registro:local
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: bibliotk-config
          env:
            - name: PORT
              value: "3000"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bibliotk-secretos
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bibliotk-secretos
                  key: DB_PASSWORD
            - name: NOTIFICACIONES_CLAVE
              valueFrom:
                secretKeyRef:
                  name: bibliotk-secretos
                  key: NOTIFICACIONES_CLAVE
          readinessProbe:
            httpGet:
              path: /RegistroBiblioTK/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /RegistroBiblioTK/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: registro
spec:
  selector:
    app: registro
  ports:
    - port: 3000
      targetPort: 3000
---
