# NotificacionesBiblioTK: 2 réplicas para mostrar el adaptador de Redis (un evento sale por los sockets de las dos)
# Mismo formato para cada servicio. Se aplica todo junto con: kubectl apply -k InfraBiblioTK
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones
  labels:
    app: notificaciones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notificaciones
  template:
    metadata:
      labels:
        app: notificaciones
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # No arranca hasta que la BD (y Redis, si hace falta) acepten conexiones
      initContainers:
        - name: esperar-dependencias
          image: bibliotk/notificaciones:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z mariadb 3306; do echo esperando a mariadb; sleep 2; done; until nc -z redis 6379; do echo esperando a redis; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: notificaciones
          image: bibliotk/notificaciones:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
          envFrom:
            - configMapRef:
                name: bibliotk-config
          env:
            - name: PORT
              value: "3006"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bibliotk-secretos
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bibliotk-secretos
                  key: DB_PASSWORD
            - name: NOTIFICACIONES_CLAVE
              valueFrom:
                secretKeyRef:
                  name: bibliotk-secretos
                  key: NOTIFICACIONES_CLAVE
          readinessProbe:
            httpGet:
              path: /NotificacionesBiblioTK/health
              port: 3006
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /NotificacionesBiblioTK/health
              port: 3006
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: notificaciones
spec:
  selector:
    app: notificaciones
  ports:
    - port: 3006
      targetPort: 3006
