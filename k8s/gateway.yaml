# Gateway nginx: único punto de entrada (misma gateway/nginx.conf.template que Docker Compose).
# Service LoadBalancer: Docker Desktop lo publica en http://localhost (puerto 80)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: gateway
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          env:
            # La imagen toma kube-dns de /etc/resolv.conf; nginx no usa los dominios de búsqueda,
            # así que los servicios van con su nombre completo
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            - name: DOMINIO
              value: .bibliotk.svc.cluster.local
          volumeMounts:
            - name: configuracion
              mountPath: /etc/nginx/templates
              readOnly: true
          readinessProbe:
            httpGet:
              path: /gateway-salud
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /gateway-salud
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: configuracion
          configMap:
            name: gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
